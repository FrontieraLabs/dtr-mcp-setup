[project]
name = "dtr-mercantil-remoto"
version = "0.1.0"
description = "Proxy MCP local: expone dtr-mercantil (servidor central, HTTPS) como conector local stdio para PCs de oficina. Evita el conector remoto por URL de Claude Desktop, que pasa por la nube de Anthropic y no alcanza IPs privadas."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]<2",
]

[project.scripts]
dtr-mercantil-remoto = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
