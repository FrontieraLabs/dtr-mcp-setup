[project]
name = "mcp-kabiku"
version = "0.1.0"
description = "MCP server para crear y leer facturas en el Portal del Cliente de Kabiku (app.kabiku.es) mediante automatizacion de navegador (Playwright), ya que Kabiku no tiene API publica."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]<2",
    "playwright>=1.47",
]

[project.scripts]
kabiku-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "kabiku_client.py"]
